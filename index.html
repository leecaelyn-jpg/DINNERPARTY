<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>봉땅 단체 주문서</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F5F1;--surface:#FFFFFF;--sunk:#ECEEE8;--ink:#1E2721;--muted:#66706A;--line:#DFE3DA;
  --accent:#44713A;--accent-ink:#FFFFFF;--accent-soft:#E3EDDD;--yolk:#F1C232;--yolk-ink:#3A2E00;
  --warn:#B8432F;--warn-soft:#F7E3DE;--ok:#2F7A4E;
  --display:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#131713;--surface:#1C211C;--sunk:#252B25;--ink:#E8ECE6;--muted:#9AA39B;--line:#303830;
  --accent:#8CBF76;--accent-ink:#10200B;--accent-soft:#26331F;--yolk:#E6BC36;--yolk-ink:#2A2100;
  --warn:#EC8A76;--warn-soft:#3A2220;--ok:#7BC99A}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#131713;--surface:#1C211C;--sunk:#252B25;--ink:#E8ECE6;--muted:#9AA39B;--line:#303830;
  --accent:#8CBF76;--accent-ink:#10200B;--accent-soft:#26331F;--yolk:#E6BC36;--yolk-ink:#2A2100;
  --warn:#EC8A76;--warn-soft:#3A2220;--ok:#7BC99A}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
h1{font:400 24px/1.2 var(--display);margin:0;letter-spacing:-.01em}
.live{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on i{background:var(--ok)}
.tabs{display:flex;gap:4px;padding-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs small{font-weight:500;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
h2{font:400 19px/1.3 var(--display);margin:0;text-wrap:balance}
.sec{display:grid;gap:12px;padding-block:20px 4px}
.hint{color:var(--muted);font-size:13px;margin:0}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.name{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-weight:500;font-size:14px;display:flex;justify-content:center;align-items:center;gap:4px;min-width:0}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name.done::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.name[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.name[aria-pressed="true"].done::after{background:var(--accent-ink)}
.mine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px}
.mine .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mine b{font-variant-numeric:tabular-nums}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats a{flex:none;text-decoration:none;color:var(--ink);background:var(--sunk);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500}
.cat{scroll-margin-top:130px}
.cat h3{font:400 17px/1.3 var(--display);margin:22px 0 2px;display:flex;gap:8px;align-items:baseline}
.cat h3 small{font:500 12px var(--body);color:var(--muted)}
.item{display:grid;grid-template-columns:1fr 104px;gap:14px;padding-block:14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{display:grid;gap:3px;align-content:start;min-width:0}
.tag{justify-self:start;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:18px}
.item .n{font-weight:700;font-size:16px;line-height:1.35}
.item .d{color:var(--muted);font-size:13px;line-height:1.5}
.item .p{font-weight:700;font-variant-numeric:tabular-nums}
.pic{position:relative;display:grid;gap:8px;align-content:start}
.pic img{width:104px;height:104px;max-width:100%;object-fit:cover;border-radius:12px;display:block;background:var(--sunk)}
.pic .badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--yolk);color:var(--yolk-ink);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgb(0 0 0/.2)}
.item.sel .pic img{outline:3px solid var(--yolk);outline-offset:-3px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:99px;padding:2px}
.step button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;font-size:18px;line-height:1;font-weight:700}
.step button.plus{background:var(--accent);color:var(--accent-ink)}
.step span{font-weight:700;font-variant-numeric:tabular-nums}
.add{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:99px;height:36px;font-weight:700;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:728px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:40px}
.bar .who{font-size:14px;color:var(--muted)}
.bar .sum{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost-danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0}
td .sub{color:var(--muted);font-size:12px}
tr.paid td{color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.pay{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pay[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.acct{display:flex;gap:8px;flex-wrap:wrap}
.acct input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.confirm span{font-size:13px;color:var(--warn);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:420px){.item{grid-template-columns:1fr 92px}.pic img{width:92px;height:92px}.stat .v{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.pic .badge{transition:transform .15s}.item.sel .pic .badge{transform:scale(1)}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="head"><h1>봉땅 단체 주문서</h1><div class="live" id="live"><i></i><span>연결 중</span></div></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-o" aria-selected="true" onclick="setTab('o')">주문하기</button>
    <button role="tab" id="tab-r" aria-selected="false" onclick="setTab('r')">수합<small id="cntR"></small></button>
    <button role="tab" id="tab-s" aria-selected="false" onclick="setTab('s')">정산</button>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<div id="toast" hidden></div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const orders=NAMES.map(()=>({items:{},paid:false}));
let account="",me=null,tab="o",col=null,metaRef=null,confirmKey=null,shared=false,sent=false,lastImport=null;
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const clean=it=>{const o={};for(const[k,q]of Object.entries(it||{}))if(BY[k]&&q>0)o[k]=Math.min(99,Math.floor(q));return o};
const cnt=i=>Object.values(orders[i].items).reduce((a,b)=>a+b,0);
const sum=i=>Object.entries(orders[i].items).reduce((a,[k,q])=>a+BY[k].p*q,0);
const list=i=>Object.entries(orders[i].items).map(([k,q])=>BY[k].n+(q>1?" ×"+q:"")).join(", ");
const lineOf=i=>cnt(i)?`${TAG} ${NAMES[i]} | ${Object.entries(orders[i].items).map(([k,q])=>BY[k].n+"×"+q).join(", ")} | ${won(sum(i))}`:`${TAG} ${NAMES[i]} | 주문 취소`;

/* 로그인 없이 쓰는 사람: 내 선택은 이 기기에만 보관 */
function loadLocal(){try{const v=JSON.parse(localStorage.getItem("bt-solo")||"null");if(v&&NAMES[v.me]!==undefined){me=v.me;orders[me].items=clean(v.items);sent=!!v.sent}}catch(e){}}
function saveLocal(){try{localStorage.setItem("bt-solo",JSON.stringify({me,items:me===null?{}:orders[me].items,sent}))}catch(e){}}

function save(i){
  if(!shared){saveLocal();return}
  col.doc("p"+i).set({items:orders[i].items,paid:orders[i].paid,at:Date.now()})
    .catch(()=>toast("저장하지 못했어요. 이 페이지 편집 권한이 있는지 확인해 주세요"));
}
function setTab(t){tab=t;confirmKey=null;render();window.scrollTo(0,0)}
function pick(i){
  if(!shared&&me!==null&&me!==i){const it=orders[me].items;orders[me].items={};orders[i].items=it}
  me=i;confirmKey=null;if(!shared)saveLocal();else{try{localStorage.setItem("bt-me",i)}catch(e){}}render();
}
function chg(id,d){
  if(me===null){toast("먼저 위에서 이름을 골라주세요");document.querySelector(".names")?.scrollIntoView({behavior:"smooth",block:"center"});return}
  const it=orders[me].items,q=Math.max(0,(it[id]||0)+d);
  if(q)it[id]=q;else delete it[id];
  confirmKey=null;render();save(me);
}
function askCancel(key){confirmKey=key;render()}
function doCancel(i){
  orders[i].items={};orders[i].paid=false;confirmKey=null;render();save(i);
  if(!shared)toast(sent?"취소했어요. 단톡방에 취소 메시지도 보내주세요":"취소했어요. 메뉴를 다시 골라주세요");
  else toast(i===me&&tab==="o"?"주문을 취소했어요. 메뉴를 다시 골라주세요":NAMES[i]+"님 주문을 취소했어요");
  if(tab==="o")window.scrollTo({top:0,behavior:"smooth"});
}
function copyMine(){
  if(me===null)return;
  const cancel=!cnt(me);
  copy(lineOf(me),cancel?"취소 메시지를 복사했어요. 단톡방에 붙여 넣어 주세요":"주문을 복사했어요. 단톡방에 붙여 넣어 주세요");
  sent=!cancel;saveLocal();render();
}
function togglePaid(i){orders[i].paid=!orders[i].paid;render();save(i)}
function saveAccount(){
  const v=$("acct").value.trim().slice(0,80);account=v;render();
  if(metaRef)metaRef.set({account:v}).then(()=>toast("입금 계좌를 저장했어요"),()=>toast("계좌를 저장하지 못했어요"));
}
function copy(text,msg){
  const done=()=>toast(msg);
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();ok?done():showText(text)};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}
}
function showText(text){const b=$("manual");if(!b)return;b.hidden=false;const t=$("manualTxt");t.value=text;t.focus();t.select();toast("복사가 막혀 있어요. 아래 글을 길게 눌러 복사해 주세요")}

/* 단톡방 글 붙여넣기 → 주문 반영 (마지막 줄이 이김) */
function parse(text){
  const found={},bad=[];
  for(const raw of String(text).split(/\r?\n/)){
    const at=raw.indexOf(TAG);if(at<0)continue;
    const parts=raw.slice(at+TAG.length).split("|").map(s=>s.trim());
    const i=NAMES.indexOf(parts[0]);
    if(i<0){bad.push(parts[0]||raw.trim());continue}
    const body=parts[1]||"";
    if(!body||/취소/.test(body)){found[i]={};continue}
    const it={};let ok=true;
    for(const seg of body.split(",")){
      const m=seg.trim().match(/^(.*?)\s*(?:[×xX*]\s*(\d+))?$/);if(!m||!m[1])continue;
      const menu=BYNAME[NORM(m[1])];
      if(!menu){ok=false;bad.push(parts[0]+" · "+m[1]);continue}
      it[menu.id]=(it[menu.id]||0)+(m[2]?+m[2]:1);
    }
    if(ok||Object.keys(it).length)found[i]=clean(it);
  }
  return{found,bad};
}
function importPaste(){
  const t=$("paste").value;const{found,bad}=parse(t);const ids=Object.keys(found);
  if(!ids.length){lastImport={n:0,bad};render();toast(`${TAG} 가 들어간 줄을 찾지 못했어요`);return}
  ids.forEach(k=>{const i=+k;orders[i].items=found[k];if(!cnt(i))orders[i].paid=false;save(i)});
  lastImport={n:ids.length,names:ids.map(k=>NAMES[k]),bad};render();
  toast(`${ids.length}명 주문을 반영했어요`);
}
function menuTotals(){
  return MENU.map(m=>{let q=0;const w=[];NAMES.forEach((n,i)=>{const c=orders[i].items[m.id];if(c){q+=c;w.push(n+(c>1?"×"+c:""))}});return{m,q,w}}).filter(r=>r.q);
}
function copyOrder(){
  const rows=menuTotals();if(!rows.length){toast("아직 주문이 없어요");return}
  const tq=rows.reduce((a,r)=>a+r.q,0),tp=rows.reduce((a,r)=>a+r.q*r.m.p,0);
  copy("[봉땅 단체 주문]\n"+rows.map(r=>`${r.m.n} ${r.q}개`).join("\n")+`\n\n총 ${tq}개 · ${won(tp)}`,"가게 주문용 목록을 복사했어요");
}
function copySettle(){
  const ppl=NAMES.map((n,i)=>({n,i})).filter(x=>cnt(x.i));if(!ppl.length){toast("아직 주문이 없어요");return}
  let s="[봉땅 정산 안내]\n"+(account?"입금 계좌: "+account+"\n":"")+"\n";
  s+=ppl.map(x=>`${x.n} ${won(sum(x.i))} (${list(x.i)})${orders[x.i].paid?" ✓입금완료":""}`).join("\n");
  copy(s,"정산 안내를 복사했어요");
}

function renderBar(){
  const bar=$("bar"),inn=$("barIn");
  if(tab!=="o"){bar.hidden=true;return}
  bar.hidden=false;
  if(me===null){inn.innerHTML='<span class="who">이름을 먼저 골라주세요</span>';return}
  const c=cnt(me);
  if(confirmKey==="me"){
    inn.innerHTML=`<div class="confirm"><span>${esc(NAMES[me])}님 주문 ${c}개를 모두 취소할까요?</span></div><div class="actions"><button class="btn" onclick="askCancel(null)">그대로 두기</button><button class="btn danger" onclick="doCancel(${me})">주문 취소</button></div>`;
    return;
  }
  const info=`<div><div class="who">${esc(NAMES[me])}님 · ${c}개</div><div class="sum">${won(sum(me))}</div></div>`;
  if(shared){
    inn.innerHTML=info+(c?`<button class="btn ghost-danger" onclick="askCancel('me')">↺ 취소하고 다시 주문</button>`:'<span class="who">메뉴의 담기를 눌러주세요</span>');
    return;
  }
  inn.innerHTML=info+'<div class="actions">'+
    (c?`<button class="btn ghost-danger" onclick="askCancel('me')">↺ 취소</button><button class="btn pri" onclick="copyMine()">주문 복사</button>`
      :(sent?`<button class="btn ghost-danger" onclick="copyMine()">취소 메시지 복사</button>`:'<span class="who">메뉴의 담기를 눌러주세요</span>'))+'</div>';
}

function renderOrder(){
  let h="";
  if(!shared){
    h+='<div class="banner">'+(FB_READY?'공유 저장에 연결하는 중이에요. 계속 이 문구가 보이면 인터넷 연결이나 Firebase 설정을 확인해 주세요.':'Firebase 설정이 아직 없어서 주문이 저장되지 않아요. index.html 안의 firebaseConfig를 채워주세요.')+'</div>';
    if(SHOW_PASTE)h+='<section class="sec"><div class="mine"><strong>이렇게 주문해요</strong>'+
      '<div class="hint">① 내 이름을 누르고 ② 먹고 싶은 메뉴를 담은 뒤 ③ 아래 <b>주문 복사</b>를 눌러 단톡방에 붙여 넣으면 끝이에요. 바꾸고 싶으면 다시 골라서 새로 복사해 보내면 마지막 글로 반영돼요. 로그인은 필요 없어요.</div></div></section>';
  }
  h+='<section class="sec"><h2>누구세요?</h2><div class="names">'+
    NAMES.map((n,i)=>`<button class="name ${shared&&cnt(i)?"done":""}" aria-pressed="${me===i}" onclick="pick(${i})"><span>${esc(n)}</span></button>`).join("")+
    '</div>'+(shared?'<p class="hint">초록 점은 주문을 마친 사람이에요. 담는 즉시 모두에게 공유되고, 내 이름은 이 기기에 기억돼요.</p>':'')+'</section>';
  if(me!==null){
    const c=cnt(me);
    h+=`<div class="mine"><div class="row"><strong>${esc(NAMES[me])}님의 주문</strong><b>${c?won(sum(me)):"아직 없음"}</b></div>`+
      (c?`<div class="hint">${esc(list(me))}</div>`:'<div class="hint">아래에서 먹고 싶은 메뉴를 담아주세요.</div>')+
      (c&&account?`<div class="hint">입금 계좌 · ${esc(account)}</div>`:"")+'</div>';
  }
  h+='<div id="manual" class="mine" hidden><strong>복사할 글</strong><textarea id="manualTxt" rows="3" readonly style="width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)"></textarea></div>';
  h+='<section class="sec"><div class="cats">'+CATS.map(c=>`<a href="#cat-${c}">${c}</a>`).join("")+'</div></section>';
  for(const c of CATS){
    const ms=MENU.filter(m=>m.c===c);
    h+=`<section class="cat" id="cat-${c}"><h3>${c}<small>${ms.length}가지</small></h3>`+ms.map(m=>{
      const q=me===null?0:(orders[me].items[m.id]||0);
      const ctl=q?`<div class="step"><button aria-label="${esc(m.n)} 하나 빼기" onclick="chg('${m.id}',-1)">−</button><span>${q}</span><button class="plus" aria-label="${esc(m.n)} 하나 더" onclick="chg('${m.id}',1)">+</button></div>`
                 :`<button class="add" onclick="chg('${m.id}',1)">담기</button>`;
      return `<div class="item ${q?"sel":""}"><div class="txt">${m.best?'<span class="tag">대표</span>':""}<div class="n">${esc(m.n)}</div><div class="d">${esc(m.d)}</div><div class="p">${won(m.p)}</div></div>`+
        `<div class="pic"><img src="${IMG[m.id]}" alt="${esc(m.n)}">${q?`<span class="badge">${q}</span>`:""}${ctl}</div></div>`;
    }).join("")+'</section>';
  }
  return h;
}

function renderResult(){
  const rows=menuTotals(),tq=rows.reduce((a,r)=>a+r.q,0),tp=rows.reduce((a,r)=>a+r.q*r.m.p,0);
  const done=NAMES.filter((_,i)=>cnt(i)).length,miss=NAMES.filter((_,i)=>!cnt(i));
  let h=!SHOW_PASTE?'':'<section class="sec"><h2>단톡방 주문 붙여넣기</h2>'+
    `<p class="hint">단톡방에서 <b>${TAG}</b>로 시작하는 글들을 한꺼번에 복사해 아래에 붙여 넣으세요. 같은 사람이 여러 번 보냈으면 마지막 글로 반영되고, 취소 메시지는 그 사람 주문을 비워요.</p>`+
    `<textarea id="paste" rows="5" placeholder="${TAG} 김귀훈 | 봉땅 에그베네딕트×1, 알배추 샐러드×1 | 26,000원" style="width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink)"></textarea>`+
    '<div class="actions"><button class="btn pri" onclick="importPaste()">주문 반영</button></div>'+'</section>';
  if(SHOW_PASTE&&lastImport){
    h+=`<div class="mine">${lastImport.n?`<div><b>${lastImport.n}명 반영</b> · ${esc(lastImport.names.join(", "))}</div>`:'<div>반영된 주문이 없어요.</div>'}`+
      (lastImport.bad.length?`<div class="hint" style="color:var(--warn)">알아보지 못한 부분: ${esc(lastImport.bad.join(" / "))}. 이름이나 메뉴 이름이 목록과 다른지 확인해 주세요.</div>`:"")+'</div>';
  }
  h+='<section class="sec"><div class="stats">'+
    `<div class="stat"><div class="k">주문한 사람</div><div class="v">${done} / ${NAMES.length}명</div></div>`+
    `<div class="stat"><div class="k">총 수량</div><div class="v">${tq}개</div></div>`+
    `<div class="stat"><div class="k">총 금액</div><div class="v">${won(tp)}</div></div></div>`;
  h+=miss.length?`<div class="chiprow"><span class="hint">아직 안 보낸 사람</span>${miss.map(n=>`<span class="pill">${esc(n)}</span>`).join("")}</div>`:'<p class="hint">15명 모두 주문을 마쳤어요.</p>';
  h+='</section><section class="sec"><h2>가게에 주문할 목록</h2>';
  h+='<div class="tw"><table><thead><tr><th>메뉴</th><th class="r">수량</th><th class="r">금액</th><th>주문한 사람</th></tr></thead><tbody>'+
    (rows.map(r=>`<tr><td>${esc(r.m.n)}<div class="sub">${won(r.m.p)}</div></td><td class="r">${r.q}</td><td class="r">${won(r.q*r.m.p)}</td><td>${esc(r.w.join(", "))}</td></tr>`).join("")||'<tr><td colspan="4" class="hint">아직 주문이 없어요</td></tr>')+
    `</tbody><tfoot><tr><td>합계</td><td class="r">${tq}</td><td class="r">${won(tp)}</td><td></td></tr></tfoot></table></div>`+
    '<div class="actions"><button class="btn pri" onclick="copyOrder()">주문 목록 복사</button><button class="btn" onclick="setTab(\'s\')">정산 보기</button></div></section>';
  return h;
}

function renderSettle(){
  const ppl=NAMES.map((n,i)=>i).filter(i=>cnt(i));
  const total=ppl.reduce((a,i)=>a+sum(i),0),got=ppl.filter(i=>orders[i].paid).reduce((a,i)=>a+sum(i),0);
  let h='<section class="sec"><div class="stats">'+
    `<div class="stat"><div class="k">받을 돈</div><div class="v">${won(total)}</div></div>`+
    `<div class="stat"><div class="k">입금 확인</div><div class="v">${won(got)}</div></div>`+
    `<div class="stat"><div class="k">남은 돈</div><div class="v">${won(total-got)}</div></div></div>`+
    `<h2>입금 계좌</h2><div class="acct"><input id="acct" placeholder="예: 카카오뱅크 3333-00-0000000 홍길동" value="${esc(account)}" maxlength="80" aria-label="입금 계좌"><button class="btn" onclick="saveAccount()">저장</button></div>`+
    '<p class="hint">적어두면 정산 안내를 복사할 때 함께 들어가요.</p></section>';
  h+='<section class="sec"><h2>개인별 보낼 금액</h2><div class="tw"><table><thead><tr><th>이름</th><th>주문 내역</th><th class="r">보낼 금액</th><th class="r">입금</th></tr></thead><tbody>'+
    NAMES.map((n,i)=>{
      if(!cnt(i))return `<tr><td>${esc(n)}</td><td><span class="pill">미주문</span></td><td class="r">-</td><td></td></tr>`;
      const ck="p"+i;
      const act=confirmKey===ck
        ?`<div class="confirm" style="justify-content:flex-end"><button class="btn sm" onclick="askCancel(null)">아니요</button><button class="btn sm danger" onclick="doCancel(${i})">취소</button></div>`
        :`<div class="confirm" style="justify-content:flex-end"><button class="pay" aria-pressed="${orders[i].paid}" onclick="togglePaid(${i})">${orders[i].paid?"입금 완료":"입금 전"}</button><button class="btn sm ghost-danger" onclick="askCancel('${ck}')" aria-label="${esc(n)}님 주문 취소">주문 취소</button></div>`;
      return `<tr class="${orders[i].paid?"paid":""}"><td>${esc(n)}</td><td>${esc(list(i))}</td><td class="r">${won(sum(i))}</td><td class="r">${act}</td></tr>`;
    }).join("")+
    `</tbody><tfoot><tr><td colspan="2">${ppl.length}명 주문</td><td class="r">${won(total)}</td><td></td></tr></tfoot></table></div>`+
    '<div class="actions"><button class="btn pri" onclick="copySettle()">정산 안내 복사</button></div>'+
    '<p class="hint">복사한 안내를 단톡방에 붙여 넣으면 각자 자기 금액을 보고 보내면 돼요.</p></section>';
  return h;
}

function render(){
  if(!shared&&tab!=="o")tab="o";
  document.querySelector(".tabs").hidden=!shared;
  for(const t of["o","r","s"])$("tab-"+t).setAttribute("aria-selected",tab===t);
  const d=NAMES.filter((_,i)=>cnt(i)).length;$("cntR").textContent=shared&&d?d+"/"+NAMES.length:"";
  const lv=$("live");lv.className="live"+(shared?" on":"");lv.lastElementChild.textContent=shared?"실시간 공유 중":(FB_READY?"연결 중…":"Firebase 설정 필요");
  const a=document.activeElement,keep=a&&(a.id==="acct"||a.id==="paste")?{id:a.id,v:a.value,s:a.selectionStart}:null;
  const pv=$("paste")?$("paste").value:"";
  $("app").innerHTML=tab==="o"?renderOrder():tab==="r"?renderResult():renderSettle();
  if($("paste")&&pv&&!keep)$("paste").value=pv;
  if(keep){const x=$(keep.id);if(x){x.value=keep.v;x.focus();try{x.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  renderBar();
}
loadLocal();render();

</script>

    const {getDatabase,ref,onValue,set}=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js");
    const db=getDatabase(initializeApp(firebaseConfig));
    col={doc:id=>({set:d=>set(ref(db,"orders/"+id),d)})};
    metaRef={set:d=>set(ref(db,"meta"),d)};
    let first=true;
    onValue(ref(db,"orders"),snap=>{
      const v=snap.val()||{};
      if(first){first=false;shared=true;me=null;try{const m=localStorage.getItem("bt-me");if(m!==null&&NAMES[+m])me=+m}catch(e){}}
      orders.forEach((o,i)=>{const d=v["p"+i]||{};o.items=clean(d.items);o.paid=!!d.paid});
      render();
    },err=>{toast("주문을 불러오지 못했어요. Firebase 규칙을 확인해 주세요");console.error(err)});
    onValue(ref(db,"meta"),snap=>{const v=snap.val()||{};account=typeof v.account==="string"?v.account:"";if(document.activeElement?.id!=="acct")render()});
  }catch(e){console.error(e);toast("Firebase에 연결하지 못했어요")}
}
</script>
</body>
</html>
